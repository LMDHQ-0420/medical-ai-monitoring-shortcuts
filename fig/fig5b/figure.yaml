id: fig5b
canvas:
  width_mm: 190
  height_mm: 82
formats:
- pdf
- svg
- png
png_dpi: 500
title: none
panel_label: none
kind: task-faceted prediction-window boxplots with model medians
legend: separate frameless files
heatmap: false
data_policy: stored result files only; five seeds averaged only where explicitly stated;
  missing values preserved
legend_frame: none
tick_guide_lines: forbidden
all_text_color: black
x_axis: 3、6、12、18和24小时五个预测时间窗；所有窗口分别绘制。
y_axis: 内部ODI减去外部医院ODI；正值表示跨医院后出现收缩。各任务独立缩放。
aggregation: 每个箱体只保留一个时间窗下6个模型×所有可估计医院×5个seed的结果，不跨时间窗平均或混合；箱体边缘是两个四分位数，贯穿箱体的黑线是中位数；六个彩色圆点是各模型在该窗口下跨医院和seed的中位数。
