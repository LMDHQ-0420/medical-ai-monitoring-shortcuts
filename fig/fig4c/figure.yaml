id: fig4c
canvas:
  width_mm: 190
  height_mm: 72
formats:
- pdf
- svg
- png
png_dpi: 500
title: none
panel_label: none
kind: task-faceted prediction-window boxplots with model medians
legend: separate frameless files
heatmap: false
data_policy: stored result files only; five seeds averaged only where explicitly stated;
  missing values preserved
legend_frame: none
tick_guide_lines: forbidden
all_text_color: black
x_axis: 3、6、12、18和24小时五个预测时间窗。
y_axis: eICU年龄差减去MIMIC年龄差；正值表示外部年龄梯度更大，负值表示更小。各任务独立缩放。
aggregation: 每个箱体保留5个模型×5个seed的25个结果；箱体边缘是两个四分位数，贯穿箱体的黑线是中位数，五个彩色圆点分别是固定模型下5个seed的中位数。
